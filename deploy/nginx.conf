server {
    listen 80;
    server_name _;
    client_max_body_size 120m;
    client_body_timeout 300s;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1k;

    # ---------- 用户端（根路径） ----------
    location / {
        root /usr/share/nginx/html/user;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---------- 管理后台（/admin/ 子路径，history 路由回退） ----------
    location /admin/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---------- 后端 API 分流 ----------
    # 管理端后端
    location /api/v1/admin/ {
        proxy_pass http://haifeng-admin:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 用户端后端
    location /api/v1/app/ {
        proxy_pass http://haifeng-app:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # SSE 流式响应不缓冲
        proxy_buffering off;
        proxy_cache off;
    }

    # ---------- PDF 报告预览（必须与前端同源）----------
    # 公开签名直链：免登录，由 URL 上的 HMAC token + expire 鉴权（后端 SecurityConfig 已放行）
    # 用 ^~ 前缀修饰符：命中后不再尝试下方 .js/.css 等正则 location
    location ^~ /api/v1/public/pdf/ {
        proxy_pass http://haifeng-app:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # PDF 渲染在首次拉取时同步执行，留足超时
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_cache off;
    }

    # 后端自托管的 pdf.js viewer 静态资源（haifeng-app:/static/pdfjs/**）
    # 关键：pdf.js 的 validateFileURL 要求 viewer 与 PDF 直链严格同源，
    # 故此处必须与上方 /api/v1/public/pdf/ 走同一个 upstream（同 host:port）。
    # 必须用 ^~，否则 /pdfjs/.../*.js 会被下方静态资源正则 location 抢走 → 404
    location ^~ /pdfjs/ {
        proxy_pass http://haifeng-app:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 管理后台静态资源缓存
    location ~* ^/admin/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 用户端静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root /usr/share/nginx/html/user;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}