spring:
  # 数据源配置
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:haifeng}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000

  # Flyway 数据库迁移（脚本位于 classpath:db/migration，启动时自动执行）
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 40MB

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: isDeleted
      logic-delete-value: true
      logic-not-delete-value: false

# JWT 配置
jwt:
  secret: ${JWT_SECRET}
  access-secret: ${JWT_ACCESS_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET}
  access-token-expire: ${JWT_ACCESS_EXPIRE:7200}
  refresh-token-expire: ${JWT_REFRESH_EXPIRE:604800}

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# 日志配置
logging:
  level:
    com.haifeng: debug
    org.springframework.security: debug

# 安全配置
haifeng:
  security:
    aes-key: ${AES_SECRET_KEY}
    hash-salt: ${HASH_SALT}

# 阿里云OSS配置
oss:
  endpoint: ${OSS_ENDPOINT}
  region: ${OSS_REGION}
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}
  bucket-name: ${OSS_BUCKET_NAME}
  # 公开素材 bucket（公共读）：仅存头像/轮播图/二维码等公开图片
  # 严禁把上面的私有 bucket 改成公共读——那会让 fileload 的 VIP 门禁失效
  public-bucket-name: ${OSS_PUBLIC_BUCKET_NAME:}
  public-url-prefix: ${OSS_PUBLIC_URL_PREFIX:}
  url-expire: ${OSS_URL_EXPIRE:3600}
  kkfileview-base-url: http://127.0.0.1:8012
