services:
  postgresql:
    image: postgres:16-alpine
    container_name: haifeng-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - max_connections=50
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - haifeng-network
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-haifeng}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    container_name: haifeng-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123} --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    networks:
      - haifeng-network
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  haifeng-admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: haifeng-admin
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRE: ${JWT_ACCESS_EXPIRE:-7200}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-604800}
      AES_SECRET_KEY: ${AES_SECRET_KEY}
      HASH_SALT: ${HASH_SALT}
      ADMIN_PORT: 18081
      JAVA_OPTS: -Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseG1GC
    networks:
      - haifeng-network
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 640m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  haifeng-app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: haifeng-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRE: ${JWT_ACCESS_EXPIRE:-7200}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-604800}
      AES_SECRET_KEY: ${AES_SECRET_KEY}
      HASH_SALT: ${HASH_SALT}
      APP_PORT: 18080
      DEEPSEEK_API_KEYS: ${DEEPSEEK_API_KEYS}
      JAVA_OPTS: -Xms128m -Xmx320m -XX:MaxMetaspaceSize=128m -XX:+UseG1GC
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - haifeng-network
    mem_limit: 640m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  kkfileview:
    image: keking/kkfileview:4.1.0
    container_name: haifeng-kkfileview
    restart: unless-stopped
    ports:
      - "8012:8012"
    environment:
      TZ: Asia/Shanghai
    networks:
      - haifeng-network
    mem_limit: 1024m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: haifeng-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist/user:/usr/share/nginx/html/user:ro
      - ./dist/admin:/usr/share/nginx/html/admin:ro
    depends_on:
      - haifeng-admin
      - haifeng-app
    networks:
      - haifeng-network
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

volumes:
  postgres_data:
  redis_data:

networks:
  haifeng-network:
    driver: bridge