name: Deploy Backend

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /opt/haifeng
            
            # 1. 拉取最新代码
            git pull --rebase origin master
            
            # 2. 重新构建 haifeng-admin 镜像（单独执行，避免并行）
            docker compose -f docker-compose.prod.yml build haifeng-admin
            
            # 3. 重新构建 haifeng-app 镜像（单独执行，避免并行）
            docker compose -f docker-compose.prod.yml build haifeng-app
            
            # 4. 重启 haifeng-admin 容器
            docker compose -f docker-compose.prod.yml up -d haifeng-admin
            
            # 5. 重启 haifeng-app 容器
            docker compose -f docker-compose.prod.yml up -d haifeng-app
            
            # 6. 清理旧镜像（可选，节省空间）
            docker image prune -f
          timeout: 60m # 增加超时时间（60分钟），因为两个构建加起来约50分钟，留些余量
