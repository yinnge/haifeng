name: Deploy Backend

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /opt/haifeng
            
            # 1. 停止并删除旧容器（释放资源）
            docker compose -f docker-compose.prod.yml down
            
            # 2. 拉取最新代码
            git pull --rebase origin master
            
            # 3. 重新构建 haifeng-admin 镜像（单独执行，避免并行）
            docker compose -f docker-compose.prod.yml build haifeng-admin
            
            # 4. 重新构建 haifeng-app 镜像（单独执行，避免并行）
            docker compose -f docker-compose.prod.yml build haifeng-app
            
            # 5. 重启 haifeng-admin 容器
            docker compose -f docker-compose.prod.yml up -d haifeng-admin
            
            # 6. 重启 haifeng-app 容器
            docker compose -f docker-compose.prod.yml up -d haifeng-app
            
            # 7. 重启 KKFileView 预览服务（拉取最新镜像）
            docker compose -f docker-compose.prod.yml pull kkfileview
            docker compose -f docker-compose.prod.yml up -d kkfileview
            
            # 8. 清理旧镜像（可选，节省空间）
            docker image prune -f
          timeout: 90m # 设置为 90 分钟，给构建留出足够时间
