
on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Stop old containers
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /opt/haifeng
            docker compose -f docker-compose.prod.yml down
          timeout: 2m

      - name: Pull latest code
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /opt/haifeng
            git pull --rebase origin master
          timeout: 2m

      - name: Build haifeng-admin
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /opt/haifeng
            export DOCKER_BUILDKIT=1
            docker compose -f docker-compose.prod.yml build haifeng-admin
          timeout: 30m

      - name: Build haifeng-app
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /opt/haifeng
            export DOCKER_BUILDKIT=1
            docker compose -f docker-compose.prod.yml build haifeng-app
          timeout: 30m

      - name: Start services
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /opt/haifeng
            docker compose -f docker-compose.prod.yml up -d haifeng-admin haifeng-app
            docker compose -f docker-compose.prod.yml pull kkfileview
            docker compose -f docker-compose.prod.yml up -d kkfileview
            # nginx 不在上面的显式列表里、也非 admin/app 的依赖，down 后不会被动拉起；
            # 每次部署后必须显式起 nginx，否则站点 80 端口失联。
            docker compose -f docker-compose.prod.yml up -d nginx
          timeout: 5m
